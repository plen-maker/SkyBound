name: SkyBound Mobile — APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: mobile
        run: npm install

      - name: Prepare android files
        run: cp mobile/google-services.json mobile/android/app/google-services.json

      - name: Build APKs
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload modern APK
        uses: actions/upload-artifact@v4
        with:
          name: Xdeck-EFB-modern
          path: mobile/android/app/build/outputs/apk/modern/release/app-modern-release.apk

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: Xdeck-EFB-legacy
          path: mobile/android/app/build/outputs/apk/legacy/release/app-legacy-release.apk
