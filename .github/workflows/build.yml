name: Xdeck EFB — Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (pl. Orion)'
        required: true

permissions:
  contents: write

jobs:

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pywebview flask flask-cors requests pyinstaller pywin32 pythonnet pillow
      - name: Convert APK icon to ICO
        shell: pwsh
        run: |
          python -c "
          from PIL import Image
          img = Image.open('mobile/assets/icon.png').convert('RGBA')
          img.save('app_icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('Icon converted')
          "
      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon=app_icon.ico --name "Xdeck-EFB" --add-data "desktop/ui;ui" --add-data "desktop/version.json;." --add-data "desktop/flights;flights" --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import webview.platforms.winforms --hidden-import clr desktop/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdeck-win
          path: dist/Xdeck-EFB.exe

  installer:
    runs-on: windows-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: xdeck-win
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build bridge EXE
        working-directory: bridge
        shell: pwsh
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --omit=optional
          npx --yes @vercel/ncc build src/index.js -o ncc_out --quiet
          # Inject service account credentials so pkg bakes them into the exe
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "ncc_out/serviceAccount.json"),
            $env:FIREBASE_SA,
            [System.Text.Encoding]::UTF8
          )
          Set-Content -Path ncc_out/package.json -Value '{"name":"bridge","version":"1.0.0","type":"commonjs","bin":"index.js","pkg":{"assets":["*.node","serviceAccount.json"]}}'
          Set-Location ncc_out
          npx --yes @yao-pkg/pkg . --target node18-win-x64 --output "$env:GITHUB_WORKSPACE/dist/bridge.exe"
      - name: Generate assets
        shell: pwsh
        run: |
          python -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          os.makedirs('installer_assets', exist_ok=True)
          W,H=164,314
          img=Image.new('RGB',(W,H),'#08090e')
          d=ImageDraw.Draw(img)
          for y in range(H):
              t=y/H; d.line([(0,y),(W,y)],fill=(int(6+t*10),int(7+t*11),int(12+t*18)))
          try:
              fb=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',14)
              fs=ImageFont.truetype('C:/Windows/Fonts/arial.ttf',9)
          except: fb=fs=ImageFont.load_default()
          d.text((12,20),'XDECK EFB',font=fb,fill=(77,240,255))
          d.text((12,40),'Orion v0.1.0',font=fs,fill=(74,96,128))
          for i,f in enumerate(['SimBrief OFP','VATSIM ATC','METAR','Sim Bridge','Push Alerts']):
              d.text((12,70+i*18),'+ '+f,font=fs,fill=(82,227,176))
          img.save('installer_assets/installer_banner.bmp')
          img2=Image.new('RGB',(55,55),'#08090e')
          d2=ImageDraw.Draw(img2)
          d2.rounded_rectangle([2,2,53,53],radius=12,fill=(14,16,28),outline=(77,240,255),width=2)
          d2.text((10,8),'X',font=fb,fill=(77,240,255))
          img2.save('installer_assets/installer_icon.bmp')
          # Use mobile app icon for installer
          ico=Image.open('mobile/assets/icon.png').convert('RGBA')
          ico.save('installer_assets/icon.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('Assets ok')
          "
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_out
          iscc installer.iss
      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: installer_out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: mobile
        run: npm install
      - name: Prepare android files
        run: cp mobile/google-services.json mobile/android/app/google-services.json
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          OUT=mobile/android/app/build/outputs/apk
          cp "$OUT/modern/release/app-modern-release.apk" "$OUT/SkyBound-EFB-modern.apk"
          cp "$OUT/legacy/release/app-legacy-release.apk" "$OUT/SkyBound-EFB-legacy.apk"
      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            mobile/android/app/build/outputs/apk/SkyBound-EFB-modern.apk
            mobile/android/app/build/outputs/apk/SkyBound-EFB-legacy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
