name: SkyBound EFB — Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (pl. v5.0.0)'
        required: true

permissions:
  contents: write

jobs:

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install UI deps
        working-directory: desktop/ui
        run: npm install

      - name: Build Tauri app
        working-directory: desktop
        shell: pwsh
        run: |
          $env:PATH = "$(Get-Location)\ui\node_modules\.bin;" + $env:PATH
          tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        working-directory: mobile
        run: npm install
      - name: Prepare android files
        run: cp mobile/google-services.json mobile/android/app/google-services.json
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          OUT=mobile/android/app/build/outputs/apk
          cp "$OUT/modern/release/app-modern-release.apk" "$OUT/SkyBound-EFB-modern.apk"
          cp "$OUT/legacy/release/app-legacy-release.apk" "$OUT/SkyBound-EFB-legacy.apk"
      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            mobile/android/app/build/outputs/apk/SkyBound-EFB-modern.apk
            mobile/android/app/build/outputs/apk/SkyBound-EFB-legacy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
