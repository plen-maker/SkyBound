name: Xdeck EFB — Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Windows EXE ──────────────────────────────────────────────────
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pywebview flask flask-cors requests pyinstaller pywin32 pythonnet pillow

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Xdeck EFB" --add-data "desktop/ui;ui" --add-data "desktop/version.json;." --add-data "desktop/flights;flights" --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import webview.platforms.winforms --hidden-import clr desktop/main.py

      - name: Upload to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Xdeck EFB — Latest"
          files: dist/Xdeck EFB.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Android APK ──────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        working-directory: mobile
        run: npm install

      - name: Expo prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: mobile/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Rename APK
        run: |
          SRC=mobile/android/app/build/outputs/apk/release
          if [ -f "${{ steps.sign.outputs.signedReleaseFile }}" ]; then
            mv "${{ steps.sign.outputs.signedReleaseFile }}" $SRC/Xdeck-EFB.apk
          else
            cp $SRC/app-release-unsigned.apk $SRC/Xdeck-EFB.apk
          fi

      - name: Upload to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Xdeck EFB — Latest"
          files: mobile/android/app/build/outputs/apk/release/Xdeck-EFB.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
