name: SkyBound — Build & Release

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Windows .exe ─────────────────────────────────────────────────
  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pywebview flask flask-cors requests pyinstaller pywin32 pythonnet

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Axesta" --add-data "desktop\ui;ui" --add-data "desktop\version.json;." --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import webview.platforms.winforms --hidden-import clr desktop\main.py

      - uses: actions/upload-artifact@v4
        with:
          name: axesta-win
          path: dist/Axesta.exe

  # ── Android APK ──────────────────────────────────────────────────
  mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile deps
        working-directory: mobile
        run: npm install

      - name: Build React
        working-directory: mobile
        run: npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: mobile/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Copy unsigned if sign failed
        if: steps.sign.outcome == 'failure'
        run: cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk mobile/android/app/build/outputs/apk/release/SkyBound.apk

      - name: Rename signed APK
        if: steps.sign.outcome == 'success'
        run: mv ${{ steps.sign.outputs.signedReleaseFile }} mobile/android/app/build/outputs/apk/release/SkyBound.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skybound-apk
          path: mobile/android/app/build/outputs/apk/release/SkyBound.apk

  # ── GitHub Release ───────────────────────────────────────────────
  release:
    needs: [desktop-win, mobile-apk]
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          if [ "${{ github.ref_name }}" = "dev" ]; then
            cp artifacts/axesta-win/Axesta.exe release-assets/Axesta-dev.exe
            cp artifacts/skybound-apk/SkyBound.apk release-assets/SkyBound-dev.apk
          else
            cp artifacts/axesta-win/Axesta.exe release-assets/Axesta.exe
            cp artifacts/skybound-apk/SkyBound.apk release-assets/SkyBound.apk
          fi

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAG="$(gh api "repos/$GH_REPO/releases" --jq 'map(select(.draft == false and .prerelease == true))[0].tag_name // empty')"
            if [ -z "$TAG" ]; then
              echo "No published prerelease found for the dev channel. Create a prerelease in GitHub first."
              exit 1
            fi
          else
            TAG="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
            if [ -z "$TAG" ]; then
              echo "No latest release found for the main channel. Create a normal release in GitHub first."
              exit 1
            fi
          fi

          gh release upload "$TAG" release-assets/* --clobber
