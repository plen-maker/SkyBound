name: Axesta — Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pywebview flask flask-cors requests pyinstaller pywin32 pythonnet

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Axesta" --add-data "desktop/ui;ui" --add-data "desktop/version.json;." --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import webview.platforms.winforms --hidden-import clr desktop/main.py

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = Get-Content desktop/version.json | ConvertFrom-Json
          echo "codename=$($v.codename)" >> $env:GITHUB_OUTPUT
          echo "version=$($v.version)" >> $env:GITHUB_OUTPUT

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Axesta ${{ steps.ver.outputs.codename }} · ${{ steps.ver.outputs.version }}"
          files: dist/Axesta.exe
          make_latest: true
          body: |
            **Axesta ${{ steps.ver.outputs.codename }}** (`${{ steps.ver.outputs.version }}`)
            Windows desktop build — automatikusan generálva a `main` branch-ről.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
