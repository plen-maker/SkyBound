name: SkyBound — Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pywebview flask flask-cors requests pyinstaller pywin32 pythonnet

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Axesta" --add-data "desktop/ui;ui" --add-data "desktop/version.json;." --add-data "desktop/flights;flights" --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import webview.platforms.winforms --hidden-import clr desktop/main.py

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = Get-Content desktop/version.json | ConvertFrom-Json
          $tag = "$($v.codename)-$($v.version)"
          echo "codename=$($v.codename)" >> $env:GITHUB_OUTPUT
          echo "version=$($v.version)" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Axesta ${{ steps.ver.outputs.codename }} · v${{ steps.ver.outputs.version }}"
          files: dist/Axesta.exe
          make_latest: true
          body: |
            ## Axesta ${{ steps.ver.outputs.codename }} · v${{ steps.ver.outputs.version }}
            
            Windows desktop build — automatikusan generálva.
            
            **Letöltés:** `Axesta.exe` alább.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile deps
        working-directory: mobile
        run: npm install

      - name: Build React
        working-directory: mobile
        run: npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: mobile/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Rename APK
        shell: bash
        run: |
          SRC=mobile/android/app/build/outputs/apk/release
          if [ -f "${{ steps.sign.outputs.signedReleaseFile }}" ]; then
            mv "${{ steps.sign.outputs.signedReleaseFile }}" $SRC/SkyBound.apk
          else
            cp $SRC/app-release-unsigned.apk $SRC/SkyBound.apk
          fi

      - name: Get version
        id: ver2
        run: |
          TAG=$(node -e "const v=require('./desktop/version.json');console.log(v.codename+'-'+v.version)")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver2.outputs.tag }}
          files: mobile/android/app/build/outputs/apk/release/SkyBound.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
