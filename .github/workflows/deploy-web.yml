name: Deploy Web

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project simapp-99f40 --token "$FIREBASE_TOKEN"
        working-directory: web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
