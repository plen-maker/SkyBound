<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<title>Xdeck EFB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --bg:#08090e;--panel:#0e1018;--p2:#141720;--line:#1e2535;
  --cy:#5ec8ff;--am:#ffb454;--gn:#52e3b0;--rd:#f06080;--pu:#a78bfa;
  --tx:#d4dff0;--dim:#4a6080;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
  --ease:cubic-bezier(0.4,0,0.2,1);
  --slow:600ms;--mid:380ms;--fast:180ms;
  --sidebar:70px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ── Layout ── */
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.body{display:flex;flex:1;overflow:hidden;min-height:0;height:0}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px;min-height:0}

/* ── Titlebar ── */
.bar{
  height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--line);
  background:rgba(14,16,24,0.92);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);flex-shrink:0;
}
.bar-left{display:flex;align-items:center;gap:11px}
.logo{width:27px;height:27px;border-radius:7px;
  background:linear-gradient(135deg,var(--cy) 0%,var(--pu) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:12px;height:12px;stroke:#06070c;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:12px;font-weight:800;letter-spacing:.8px}
.logo-sub{font-size:8px;color:var(--dim);margin-top:1px;letter-spacing:.3px}
.bar-right{display:flex;align-items:center;gap:12px}
.bstat{text-align:right;line-height:1.3}
.bstat-l{font-size:7px;color:var(--dim);letter-spacing:1.8px;text-transform:uppercase}
.bstat-v{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--dim);
  transition:color var(--slow) var(--ease)}
.bstat-v.on{color:var(--tx)}
.bstat-v sub{font-size:7px;color:var(--dim);margin-left:1px}
.sep{width:1px;height:18px;background:var(--line);opacity:.6}
.livepill{
  display:flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;
  font-size:9px;font-weight:600;letter-spacing:.5px;
  background:rgba(74,96,128,.07);border:1px solid rgba(74,96,128,.12);
  color:var(--dim);transition:all var(--slow) var(--ease)
}
.livepill.on{background:rgba(82,227,176,.07);border-color:rgba(82,227,176,.2);color:var(--gn)}
.ldot{width:4px;height:4px;border-radius:50%;background:currentColor;transition:background var(--slow) var(--ease)}
.livepill.on .ldot{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.65)}55%{opacity:1;transform:scale(1.25)}}
.bar-email{font-size:9px;color:var(--dim);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  background:none;border:none;cursor:pointer;color:var(--dim);
  padding:5px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease)
}
.iconbtn:hover{color:var(--tx);background:var(--p2)}
.iconbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar);border-right:1px solid var(--line);
  background:rgba(8,9,14,.7);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;padding:8px 4px;gap:1px;flex-shrink:0;
  transition:width var(--mid) var(--ease)
}
.nav{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0;border-radius:9px;cursor:pointer;color:var(--dim);
  border:none;background:transparent;width:100%;font-family:var(--font);
  position:relative;overflow:hidden;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)
}
.nav::before{
  content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;
  background:var(--cy);border-radius:0 2px 2px 0;
  transform:scaleY(0);transition:transform var(--mid) var(--ease)
}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--p2);color:var(--cy)}
.nav.on::before{transform:scaleY(1)}
.nav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--mid) var(--ease)}
.nav:hover svg{transform:scale(1.1)}
.nav span{font-size:8px;letter-spacing:.4px;font-weight:600}
.nav-spacer{flex:1}

/* ── Cards ── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:14px;margin-bottom:8px;
  transition:border-color var(--mid) var(--ease)
}
.card:hover{border-color:rgba(94,200,255,.08)}
.p2{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* ── Buttons ── */
.btn{
  border:none;border-radius:8px;padding:7px 15px;font-size:12px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);
  transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease),
             filter var(--fast) var(--ease)
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn-cy{background:var(--cy);color:#06070c}
.btn-dk{background:var(--p2);color:var(--dim);border:1px solid var(--line)}
.btn-dk:hover{color:var(--tx)}
.pill{
  border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--p2);color:var(--dim);font-family:var(--font);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             border-color var(--fast) var(--ease),transform var(--fast) var(--ease)
}
.pill:hover{color:var(--tx);border-color:var(--dim)}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--cy);color:#06070c;border-color:var(--cy)}

/* ── Input ── */
.inp{
  background:var(--p2);border:1px solid var(--line);color:var(--tx);
  font-size:13px;border-radius:8px;padding:7px 10px;font-family:var(--font);outline:none;
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)
}
.inp:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(94,200,255,.08)}

/* ── Data rows ── */
.drow{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid rgba(30,37,53,.7)
}
.drow:last-child{border-bottom:none}
.dl{font-size:11px;color:var(--tx)}.dv{font-size:11px;font-variant-numeric:tabular-nums}

/* ── Grids ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g1{display:grid;grid-template-columns:1fr;gap:8px}

/* ── Stat cards ── */
.sc{
  background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  transition:border-color var(--slow) var(--ease),background var(--slow) var(--ease)
}
.sc.on{border-color:rgba(94,200,255,.12);background:rgba(94,200,255,.03)}
.sc-l{font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.sc-v{
  font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);
  transition:color var(--slow) var(--ease)
}
.sc-v.on{color:var(--tx)}
.sc-v sub{font-size:8px;color:var(--dim);margin-left:2px;vertical-align:middle}

/* ── Shortcut tiles ── */
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px;cursor:pointer;text-align:left;width:100%;font-family:var(--font);
  transition:background var(--mid) var(--ease),border-color var(--mid) var(--ease),
             transform var(--fast) var(--ease),box-shadow var(--mid) var(--ease)
}
.tile:hover{
  background:var(--p2);border-color:rgba(94,200,255,.18);
  transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)
}
.tile:active{transform:translateY(0);box-shadow:none}
.tile-ic{
  width:28px;height:28px;border-radius:7px;background:var(--p2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:7px;
  transition:transform var(--mid) var(--ease)
}
.tile:hover .tile-ic{transform:scale(1.05)}
.tile-ic svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile-nm{font-size:11px;font-weight:600;color:var(--tx);margin-bottom:1px}
.tile-sb{font-size:9px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── VATSIM ── */
.vitem{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:5px;cursor:pointer;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)
}
.vitem:hover{background:var(--p2)}
.fbadge{border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700;display:inline-block}
.atis-body{
  margin-top:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;font-size:10px;color:var(--dim);line-height:1.7;
  display:none;font-family:var(--mono)
}
.atis-body.open{display:block;animation:fadeIn var(--mid) var(--ease)}

/* ── OFP realistic (SimBrief style) ── */
.ofp-doc{
  background:#fafafa;color:#111;border-radius:10px;padding:20px 22px;
  font-family:var(--mono);font-size:11px;line-height:1.6;
  white-space:pre-wrap;word-break:break-all;
  border:1px solid #ddd;margin-top:8px;
  box-shadow:0 2px 20px rgba(0,0,0,.4)
}

/* ── Alerts ── */
.warn{
  display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 12px;font-size:11px;
  background:rgba(255,180,84,.04);border:1px solid rgba(255,180,84,.1);
  color:var(--am);margin-bottom:8px
}
.err{
  display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 12px;font-size:11px;
  background:rgba(240,96,128,.04);border:1px solid rgba(240,96,128,.12);
  color:var(--rd);margin-bottom:8px
}

/* ── Settings ── */
.srow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;margin-bottom:6px;
  transition:border-color var(--fast) var(--ease)
}
.srow:hover{border-color:rgba(94,200,255,.08)}
.slabel{font-size:12px;color:var(--tx);font-weight:500}
.sdesc{font-size:9px;color:var(--dim);margin-top:2px}
.swatch{
  width:22px;height:22px;border-radius:50%;cursor:pointer;padding:0;
  transition:transform var(--mid) var(--ease),box-shadow var(--mid) var(--ease)
}
.swatch:hover{transform:scale(1.2)}
.swatch.on{transform:scale(1.12)}

/* ── Browser ── */
#browser{
  position:fixed;inset:0;z-index:100;display:none;flex-direction:column;
  background:var(--bg);animation:fadeIn var(--mid) var(--ease)
}
#browser.open{display:flex}
.br-bar{
  height:42px;display:flex;align-items:center;gap:7px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0
}
.br-btn{
  background:var(--p2);border:1px solid var(--line);color:var(--tx);
  border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;font-family:var(--font);
  transition:background var(--fast) var(--ease)
}
.br-btn:hover{background:var(--line)}
.br-url{
  flex:1;background:var(--p2);border:1px solid var(--line);border-radius:6px;
  padding:3px 10px;font-size:10px;color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap
}
#brFrame{flex:1;border:none}

/* ── Login ── */
#lo{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at 35% 25%,#0d1524 0%,var(--bg) 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:999
}
.lo-icon{
  width:58px;height:58px;border-radius:15px;
  background:linear-gradient(135deg,var(--cy),var(--pu));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(94,200,255,.25)
}
.lo-icon svg{width:25px;height:25px;stroke:#06070c;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Map ── */
.map-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--line)}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp var(--slow) var(--ease) both}
.anim-fast{animation:fadeUp var(--mid) var(--ease) both}

/* ── Utils ── */
.flex{display:flex}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.aic{align-items:center}.jb{justify-content:space-between}.f1{flex:1}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.hidden{display:none!important}
</style>
</head>

</div>

  const fs={small:"12px",normal:"13px",large:"15px"};

let _bridgePollInterval = null;

async function checkBridgeStatus(){
  const r = await api("/api/bridge/status");
  if(r && r.running !== undefined){
    S.bridge.running = r.running;
    renderBridgeBtn();
  }
}

async function toggleBridge(){
  if(S.bridge.loading) return;
  S.bridge.loading = true;
  renderBridgeBtn();
  if(S.bridge.running){
    await api("/api/bridge/stop", {method:"POST"});
  } else {
    const r = await api("/api/bridge/start", {method:"POST"});
    if(r.error){ S.bridge.err=r.error; S.bridge.loading=false; renderBridgeBtn(); return; }
  }
  await new Promise(r=>setTimeout(r,1200));
  await checkBridgeStatus();
  S.bridge.loading = false;
  S.bridge.err = "";
  renderBridgeBtn();
}

function renderBridgeBtn(){
  const btn = document.getElementById("bridgeToggleBtn");
  if(!btn) return;
  const {running, loading, err} = S.bridge;
  btn.style.background = loading ? "rgba(255,180,84,.12)" : running ? "rgba(82,227,176,.12)" : "rgba(74,96,128,.08)";
  btn.style.borderColor = loading ? "rgba(255,180,84,.3)" : running ? "rgba(82,227,176,.3)" : "rgba(74,96,128,.2)";
  btn.style.color = loading ? "var(--am)" : running ? "var(--gn)" : "var(--dim)";
  btn.innerHTML = loading ? "⏳ Bridge..." : running ? "🟢 Bridge" : "⚫ Bridge";
}

function connectRTDB(){
  _uns.forEach(u=>u());_uns=[];

  r1.on("value",s=>{clearTimeout(lt);lt=setTimeout(()=>{S.live=s.val();renderBar();},300);},()=>{});
  _uns.push(()=>r1.off());
  const r2=db.ref(".info/connected");

function renderMap(m){
  m.style.padding="0";m.style.overflow="hidden";
  const d=el("div");d.id="leafletMap";d.style.cssText="width:100%;height:calc(100vh - 50px)";m.appendChild(d);

    l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(l);}
  const init=()=>{
    if(window._lfMap)return;
    const fixes=(S.ofp?.fixes||[]).filter(f=>f.lat!=null);
    const center=S.live&&S.live.lat?[S.live.lat,S.live.lon]:fixes.length?[fixes[Math.floor(fixes.length/2)].lat,fixes[Math.floor(fixes.length/2)].lon]:[47.4,19.26];
    const map=L.map("leafletMap",{zoomControl:true,attributionControl:false}).setView(center,7);
    window._lfMap=map;
    const style=S.cfg.mapStyle||"satellite";
    if(style==="street"){
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    }else{
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(map);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,opacity:.6}).addTo(map);
    }
    if(S.cfg.mapRoute&&fixes.length>1){
      L.polyline(fixes.map(f=>[f.lat,f.lon]),{color:"#5ec8ff",weight:2,dashArray:"7,5",opacity:.7}).addTo(map);
      fixes.forEach((f,i)=>{
        if(!(i===0||i===fixes.length-1||i%Math.max(1,Math.floor(fixes.length/8))===0))return;
        L.circleMarker([f.lat,f.lon],{radius:i===0||i===fixes.length-1?6:3,
          color:i===0?"#52e3b0":i===fixes.length-1?"#f06080":"#5ec8ff",
          fillColor:i===0?"#52e3b0":i===fixes.length-1?"#f06080":"#1a4070",fillOpacity:1,weight:2}).bindTooltip(f.ident).addTo(map);
      });
    }
    if(S.live&&S.live.lat){
      const ic=L.divIcon({html:`<svg viewBox='0 0 24 24' width='20' height='20'><path d='M12 2 L16 17 L12 13 L8 17 Z' fill='white' stroke='#5ec8ff' stroke-width='1.5'/></svg>`,iconSize:[20,20],iconAnchor:[10,10],className:""});
      L.marker([S.live.lat,S.live.lon],{icon:ic}).addTo(map);
    }
  };
  if(window.L)init();
  else{const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.onload=init;document.head.appendChild(s);}
}

function buildOFPText(o,wu){
  const pad=(s,n)=>String(s||"").padEnd(n);
  const rpad=(s,n)=>String(s||"").padStart(n);
  const line=(n=60)=>"─".repeat(n);
  const fmt2=(v,u="")=>v==null?".....":`${Math.round(v)}${u}`;

  return `
${pad("[ OFP ]",10)}
${line(72)}
${pad(o.dep||"????",4)} → ${pad(o.arr||"????",4)}   ${o.aircraft||""}
${line(72)}

  ATC CALLSIGN    ${pad(o.dep||"",4)}/${pad(o.arr||"",4)}
  ALTERNATE       ${o.altn||"...."}

${line(72)}
           PLANNED FUEL
${line(72)}
  FUEL              FUEL       TIME
  ${line(40)}
  TRIP                  ${rpad(fmt2(o.enrouteBurn),8)}
  CONT 15 MIN           ${rpad(fmt2(o.contFuel),8)}
  ALTN          ${pad(o.altn||"....",4)} ${rpad(fmt2(o.altFuel),8)}
  FINRES                ${rpad(fmt2(o.resFuel),8)}
  ${line(40)}
  MINIMUM T/OFF FUEL    ${rpad(fmt2((o.blockFuel||0)-(o.extraFuel||0)),8)}
  ${line(40)}
  EXTRA                 ${rpad(fmt2(o.extraFuel),8)}
  ${line(40)}
  BLOCK FUEL            ${rpad(fmt2(o.blockFuel),8)}
${line(72)}

  PAX          ${rpad(fmt2(o.pax),6)}
  PAYLOAD      ${rpad(fmt2(o.payload),10)} ${wu}
  ZFW          ${rpad(fmt2(o.zfw),10)} ${wu}
  TOW          ${rpad(fmt2(o.tow),10)} ${wu}
  COST INDEX   ${rpad(fmt2(o.costindex),6)}
  ROUTE DIST   ${rpad(fmt2(o.routeDistanceNm),6)} NM
  ETE          ${o.ete||"..."}

${line(72)}
  ROUTE:
  ${(o.route||"").replace(/(.{70})/g,"$1\n  ")}

${line(72)}
  NAVLOG
  ${line(40)}
  FIX              FL    LAT      LON
  ${line(40)}
${(o.fixes||[]).slice(0,30).map(f=>
  `  ${pad(f.ident,16)} ${rpad(f.altitude?Math.round(f.altitude/100):"???",3)}   ${f.lat?.toFixed(3)||"?????"}  ${f.lon?.toFixed(3)||"??????"}`
).join("\n")}

${line(72)}
              - Not for real world navigation -
`.trim();
}

let _metarIcao = "";
let _metarData = null;
let _metarLoading = false;
let _metarErr = "";

async function loadMetar(icao) {
  if(!icao) return;
  _metarLoading=true; _metarErr=""; _metarData=null;
  if(S.tab==="metar") renderMetarContent();
  try {
    const r = await api("/api/metar?icao="+encodeURIComponent(icao));
    if(r.error) _metarErr=r.error;
    else _metarData=r;
  } catch(e) { _metarErr=e.message; }
  _metarLoading=false;
  if(S.tab==="metar") renderMetarContent();
}

function renderMetarContent(){
  const m=$("main");
  if(!m||S.tab!=="metar")return;
  m.innerHTML=""; m.style.padding="20px 22px";
  renderMetar(m);
}

function parseMetar(raw) {
  if(!raw) return null;
  const r = {};
  // Wind: 27015KT or 27015G25KT or VRB05KT
  const wind = raw.match(/(\d{3}|VRB)(\d{2,3})(G(\d{2,3}))?KT/);
  if(wind) { r.windDir=wind[1]==="VRB"?"VRB":parseInt(wind[1]); r.windSpd=parseInt(wind[2]); if(wind[4]) r.windGust=parseInt(wind[4]); }
  // Visibility: 9999 or 8000
  const vis = raw.match(/(\d{4})/);
  if(vis) r.vis=parseInt(vis[1]);
  // Clouds: FEW/SCT/BKN/OVC + height
  const clouds = [];
  const cloudRe = /(FEW|SCT|BKN|OVC)(\d{3})/g;
  let cm;
  while((cm=cloudRe.exec(raw))!==null) clouds.push({type:cm[1],ft:parseInt(cm[2])*100});
  r.clouds=clouds;
  // Temp/dew: 12/08 or M02/M05
  const td = raw.match(/(M?\d{2})\/(M?\d{2})/);
  if(td){ r.temp=parseInt(td[1].replace("M","-")); r.dew=parseInt(td[2].replace("M","-")); }
  // QNH: Q1013 or A2992
  const q = raw.match(/Q(\d{4})/);
  if(q) r.qnh=parseInt(q[1]);
  const a = raw.match(/A(\d{4})/);
  if(a) r.qnhInHg=(parseInt(a[1])/100).toFixed(2);
  // Wx: -RA, +SN, TSRA, etc
  const wx = raw.match(/[-+]?(TS|RA|SN|DZ|FG|BR|HZ|SQ|FC|GR|GS|PL|IC|UP|FU|VA|SA|DU|MIFG|BCFG|PRFG|DRDU|DRSN|BLDU|BLSN|BLSA|VCSH|VCTS|VCFG|VCBLDU|VCBLSN|VCBLSA|VCPO|VCDS|VCSS)+/g);
  if(wx) r.wx=wx.join(" ");
  return r;
}

function windArrow(dir) {
  if(dir==="VRB") return "↻";
  const arrows=["↓","↙","←","↖","↑","↗","→","↘"];
  return arrows[Math.round(((dir+180)%360)/45)%8];
}

function cloudColor(type) {
  return {FEW:"var(--gn)",SCT:"var(--am)",BKN:"var(--rd)",OVC:"var(--rd)"}[type]||"var(--dim)";
}

function renderMetar(m) {
  const {ofp,cfg}=S;
  // Auto-set ICAO from OFP if empty
  if(!_metarIcao && ofp) _metarIcao = ofp.dep||ofp.arr||"";

  const hdr=el("div","flex aic jb anim");hdr.style.marginBottom="10px";
  const sl=el("div","sl");sl.style.margin="0";sl.textContent="METAR / TAF";
  hdr.appendChild(sl);m.appendChild(hdr);

  // ICAO input
  const card=el("div","card anim");
  const lbl=el("div");lbl.style.cssText="font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px";lbl.textContent="Airport ICAO";
  const row=el("div","flex gap8 aic");
  const inp=el("input","inp");inp.style.cssText="font-size:20px;letter-spacing:4px;width:120px;text-transform:uppercase";
  inp.value=_metarIcao;inp.placeholder="LHBP";inp.maxLength=4;
  inp.addEventListener("input",()=>{_metarIcao=inp.value.toUpperCase();inp.value=_metarIcao;});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")loadMetar(_metarIcao);});
  const loadBtn=el("button","btn btn-cy");loadBtn.textContent=_metarLoading?"↻ ...":"🌤 Betölt";
  loadBtn.addEventListener("click",()=>loadMetar(_metarIcao));
  row.appendChild(inp);row.appendChild(loadBtn);

  // Quick select from OFP
  if(ofp){
    [ofp.dep,ofp.arr,ofp.altn].filter(Boolean).forEach((ic,i)=>{
      const b=el("button","pill"+(ic===_metarIcao?" on":""));
      b.textContent=ic+" "+["DEP","ARR","ALTN"][i];
      b.style.color=["var(--gn)","var(--cy)","var(--am)"][i];
      b.addEventListener("click",()=>{_metarIcao=ic;inp.value=ic;loadMetar(ic);});
      row.appendChild(b);
    });
  }
  card.appendChild(lbl);card.appendChild(row);m.appendChild(card);

  if(_metarErr){const e=el("div","err");e.textContent="⚠ "+_metarErr;m.appendChild(e);}
  if(_metarLoading){const l=el("div","warn");l.textContent="⏳ Betöltés...";m.appendChild(l);return;}
  if(!_metarData)return;

  const items = Array.isArray(_metarData) ? _metarData : [_metarData];

  items.forEach((item,idx2)=>{
    const raw = item.rawOb||item.raw_text||item.raw||"";
    const p = parseMetar(raw);
    if(!p&&!raw) return;

    const card2=el("div","card anim");card2.style.animationDelay=(idx2*50)+"ms";

    // Station + time header
    const stHdr=el("div","flex aic jb");stHdr.style.marginBottom="10px";
    const stName=el("div");
    stName.innerHTML=`<div style='font-size:16px;font-weight:800;font-variant-numeric:tabular-nums'>${item.stationId||item.station_id||_metarIcao}</div>
      <div style='font-size:9px;color:var(--dim);margin-top:2px'>${item.observationTime||item.observation_time||""}</div>`;
    const flightCat=el("div");
    const cat=item.flightCategory||item.flight_category||"";
    const catCol={VFR:"var(--gn)",MVFR:"var(--cy)",IFR:"var(--am)",LIFR:"var(--rd)"}[cat]||"var(--dim)";
    if(cat) flightCat.innerHTML=`<span style='border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;background:${catCol}18;border:1px solid ${catCol}38;color:${catCol}'>${cat}</span>`;
    stHdr.appendChild(stName);stHdr.appendChild(flightCat);
    card2.appendChild(stHdr);

    // Wind
    if(p?.windDir!==undefined){
      const wRow=el("div","flex aic gap8");wRow.style.marginBottom="8px";
      const wIcon=el("div");wIcon.style.cssText="font-size:28px;width:36px;text-align:center";wIcon.textContent=windArrow(p.windDir);
      const wInfo=el("div");
      const gustStr=p.windGust?` G${p.windGust}`:"";
      wInfo.innerHTML=`<div style='font-size:20px;font-weight:700;font-variant-numeric:tabular-nums'>${p.windDir==="VRB"?"VRB":p.windDir+"°"} ${p.windSpd}${gustStr} kt</div>
        <div style='font-size:9px;color:var(--dim)'>${p.windDir==="VRB"?"Variable wind":"Wind direction"}</div>`;
      wRow.appendChild(wIcon);wRow.appendChild(wInfo);
      card2.appendChild(wRow);
    }

    // Stats grid
    const grid=el("div","g2");grid.style.gap="6px";grid.style.marginBottom="8px";
    const stats=[
      ["Látás", p?.vis!=null?(p.vis>=9999?"10+ km":p.vis+"m"):null, "var(--tx)"],
      ["QNH", p?.qnh?p.qnh+" hPa"+(p.qnhInHg?" / "+p.qnhInHg+""":""):null, "var(--cy)"],
      ["Hőmérséklet", p?.temp!=null?p.temp+"°C":null, p?.temp<0?"var(--cy)":"var(--am)"],
      ["Harmatpont", p?.dew!=null?p.dew+"°C":null, "var(--dim)"],
    ];
    stats.forEach(([l,v,ac])=>{
      if(!v) return;
      const d=el("div");d.style.cssText="display:flex;justify-content:space-between;padding:6px 9px;background:var(--p2);border-radius:7px;border:1px solid var(--line)";
      d.innerHTML=`<span style='font-size:10px;color:var(--dim)'>${l}</span><span style='font-size:12px;font-variant-numeric:tabular-nums;color:${ac}'>${v}</span>`;
      grid.appendChild(d);
    });
    card2.appendChild(grid);

    // Clouds
    if(p?.clouds?.length){
      const cDiv=el("div","flex gap6");cDiv.style.marginBottom="8px";
      p.clouds.forEach(cl=>{
        const b=el("div");b.style.cssText=`padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;background:${cloudColor(cl.type)}18;border:1px solid ${cloudColor(cl.type)}35;color:${cloudColor(cl.type)}`;
        b.textContent=`${cl.type} ${cl.ft.toLocaleString()}ft`;
        cDiv.appendChild(b);
      });
      card2.appendChild(cDiv);
    }

    // Wx phenomena
    if(p?.wx){
      const wx=el("div");wx.style.cssText="font-size:12px;color:var(--am);margin-bottom:8px;font-weight:600";
      wx.textContent="⚠ "+p.wx;card2.appendChild(wx);
    }

    // Raw METAR
    const rawDiv=el("div");rawDiv.style.cssText="font-family:var(--mono);font-size:10px;color:var(--dim);padding:8px 10px;background:var(--bg);border-radius:7px;border:1px solid var(--line);line-height:1.6;word-break:break-all";
    rawDiv.textContent=raw;card2.appendChild(rawDiv);

    m.appendChild(card2);
  });

  // Auto-load DEP on first visit
  if(!_metarData&&!_metarLoading&&_metarIcao) loadMetar(_metarIcao);
}

// ── SETTINGS ──────────────────────────────────────────────────────
function renderSettings(m){
  const {cfg}=S;

  function srow(label,desc,content,delay=0){
    const row=el("div","srow anim");
    const left=el("div");
    const lbl=el("div","slabel");lbl.textContent=label;left.appendChild(lbl);
    if(desc){const d=el("div","sdesc");d.textContent=desc;left.appendChild(d);}
    row.appendChild(left);row.appendChild(content);m.appendChild(row);
  }

  function pills(options,current,onChange){
    const w=el("div","flex gap6");
    options.forEach(([v,l])=>{
      const b=el("button","pill"+(current===v?" on":""));b.textContent=l;
      b.addEventListener("click",()=>{
        onChange(v);
        // Update pill states in-place — no full re-render
        w.querySelectorAll(".pill").forEach((p,i)=>p.classList.toggle("on",options[i][0]===v));
      });w.appendChild(b);
    });
    return w;
  }

  function textInp(val,placeholder,width,onChange){
    const i=el("input","inp");i.value=val;i.placeholder=placeholder;i.style.width=width;
    i.addEventListener("change",()=>onChange(i.value));return i;
  }


  // 1. Téma
  const sw=el("div","flex gap8 aic");
  [["dark","#08090e","#5ec8ff"],["midnight","#000005","#5ec8ff"],["navy","#080a1a","#4db8ff"],
   ["green","#060e09","#33e899"],["amber","#0d0904","#ffaa22"],["light","#edf1f7","#0878be"]].forEach(([v,bg,ac])=>{
    const s=el("button","swatch"+(cfg.theme===v?" on":""));s.title=v;
    s.style.cssText=`background:linear-gradient(135deg,${bg} 50%,${ac} 50%);border:${cfg.theme===v?"3px solid "+ac:"2px solid var(--line)"};box-shadow:${cfg.theme===v?"0 0 8px "+ac+"55":"none"}`;
    s.addEventListener("click",()=>{
      S.cfg.theme=v;applyTheme(v);saveCfg();
      // Update swatch borders in-place
      sw.querySelectorAll(".swatch").forEach((sw2,i)=>{
        const [v2,,ac2]=[["dark","#08090e","#5ec8ff"],["midnight","#000005","#5ec8ff"],["navy","#080a1a","#4db8ff"],["green","#060e09","#33e899"],["amber","#0d0904","#ffaa22"],["light","#edf1f7","#0878be"]][i];
        sw2.style.border=S.cfg.theme===v2?"3px solid "+ac2:"2px solid var(--line)";
        sw2.style.boxShadow=S.cfg.theme===v2?"0 0 8px "+ac2+"55":"none";
        sw2.classList.toggle("on",S.cfg.theme===v2);
      });
    });sw.appendChild(s);
  });
  srow("Téma","Megjelenési téma",sw);

  // 2. SimBrief
  const sbRow=el("div","flex gap8 aic");
  const sbInp=textInp(cfg.sbUser||"","pl. ddnemet","160px",v=>{S.cfg.sbUser=v;saveCfg();});
  const sbBtn=el("button","btn btn-cy");sbBtn.style.cssText="font-size:11px;padding:6px 12px";sbBtn.textContent="Betölt";
  sbBtn.addEventListener("click",()=>{S.cfg.sbUser=sbInp.value;loadOFP(sbInp.value);});
  sbRow.appendChild(sbInp);sbRow.appendChild(sbBtn);
  srow("SimBrief usernév","OFP betöltés",sbRow);

  // 3. Fenix EFB
  srow("Fenix EFB cím","pl. http://192.168.1.5:8080",
    textInp(cfg.fenixUrl||"","http://192.168.1.x:8080","220px",v=>{S.cfg.fenixUrl=v;saveCfg();}));

  // 4. Session kód
  srow("Session kód","Firebase sync azonosító",
    textInp(cfg.sessionCode||"","ddnemet-host","160px",v=>{S.cfg.sessionCode=v;saveCfg();connectRTDB();}));

  // 5. OFP megjelenítés
  srow("OFP megjelenítés","Simplified vagy valódi SimBrief doc",
    pills([["simplified","Simplified"],["realistic","Realistic"]],cfg.ofpMode,v=>{S.cfg.ofpMode=v;saveCfg();(()=>{
      if(S.tab!=="settings")return;
      const m=document.getElementById("main");
      const sy=m?m.scrollTop:0;
      m.innerHTML="";
      m.style.padding="20px 22px";
      renderSettings(m);
      setTimeout(()=>{if(m)m.scrollTop=sy;},10);
    })();}));

  // 6. Grid elrendezés
  srow("Shortcut grid","Oszlopok száma a kezdőlapon",
    pills([["1","1"],["2","2"],["3","3"],["4","4"]],cfg.gridCols||"4",v=>{S.cfg.gridCols=v;saveCfg();(()=>{
      if(S.tab!=="settings")return;
      const m=document.getElementById("main");
      const sy=m?m.scrollTop:0;
      m.innerHTML="";
      m.style.padding="20px 22px";
      renderSettings(m);
      setTimeout(()=>{if(m)m.scrollTop=sy;},10);
    })();}));

  // 7. Linkek megnyitása
  srow("Linkek megnyitása","Rendszer böngésző vagy beépített",
    pills([["browser","Böngészőben"],["app","App-ban"]],cfg.linkMode||"browser",v=>{S.cfg.linkMode=v;saveCfg();}));

  // 8. OFP auto-betöltés
  srow("Induláskor OFP betölt","Automatikus SimBrief lekérés",
    pills([["true","Igen"],["false","Nem"]],String(cfg.autoLoadOfp!==false),v=>{S.cfg.autoLoadOfp=v==="true";saveCfg();}));

  // 9. Idő formátum
  srow("Időzóna megjelenítés","Titlebar óra",
    pills([["utc","UTC"],["local","Helyi"]],cfg.timeMode||"utc",v=>{S.cfg.timeMode=v;saveCfg();}));

  // 10. Sebesség egység
  srow("Sebesség egység","GS kijelzés",
    pills([["kt","Knot (kt)"],["kmh","km/h"]],cfg.speedUnit||"kt",v=>{S.cfg.speedUnit=v;saveCfg();renderBar();}));

  // 11. Súly egység
  srow("Súly egység","Fuel és payload megjelenítés",
    pills([["kg","kg"],["lbs","lbs"]],cfg.weightUnit||"kg",v=>{S.cfg.weightUnit=v;saveCfg();}));

  // 12. Térkép stílus
  srow("Térkép stílus","Satellite vagy utcatérkép",
    pills([["satellite","Satellite"],["street","Street"]],cfg.mapStyle||"satellite",v=>{S.cfg.mapStyle=v;saveCfg();}));

  // 13. Route megjelenítés
  srow("Route a térképen","OFP útvonal megjelenítése",
    pills([["true","Igen"],["false","Nem"]],String(cfg.mapRoute!==false),v=>{S.cfg.mapRoute=v==="true";saveCfg();}));

  // 14. Betűméret
  srow("Betűméret","UI szövegméret",
    pills([["small","Kis"],["normal","Normál"],["large","Nagy"]],cfg.fontSize||"normal",v=>{S.cfg.fontSize=v;saveCfg();applyTheme(cfg.theme);}));

  // 15. Animáció sebesség
  srow("Animáció sebesség","Átmenetek és effektek",
    pills([["slow","Lassú"],["normal","Normál"],["fast","Gyors"],["off","Ki"]],cfg.animSpeed||"normal",v=>{S.cfg.animSpeed=v;saveCfg();applyTheme(cfg.theme);}));

  // 16. VATSIM frissítés
  const vatsimRow=el("div","flex gap6 aic");
  [["30","30s"],["60","1 perc"],["120","2 perc"],["300","5 perc"]].forEach(([v,l])=>{
    const b=el("button","pill"+(String(cfg.vatsimInterval||60)===v?" on":""));b.textContent=l;
    b.addEventListener("click",()=>{S.cfg.vatsimInterval=Number(v);saveCfg();});vatsimRow.appendChild(b);
  });
  srow("VATSIM frissítés","Auto-frissítés intervallum",vatsimRow);

  // 17. Értesítések
  srow("Push értesítések","Firebase trigger hangjelzés",
    pills([["true","Be"],["false","Ki"]],String(cfg.notifications!==false),v=>{S.cfg.notifications=v==="true";saveCfg();}));

  // 18. Verzió
  const verRow=el("div","flex aic gap8");
  const vs=el("span");vs.style.cssText="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums";
  vs.textContent=`${cfg.codename||"Sequoia"} · ${cfg.version||"0.1.0"}`;
  if(cfg.channel==="dev"||cfg.channel==="beta"){
    const ch=el("span");ch.style.cssText="border-radius:99px;padding:2px 8px;font-size:9px;font-weight:700;background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.25);color:var(--am)";
    ch.textContent=cfg.channel.toUpperCase();verRow.appendChild(ch);
  }
  verRow.appendChild(vs);
  srow("Verzió","",verRow);

  // 19. Dev mód toggle
  srow("Dev mód","Fejlesztői opciók megjelenítése",
    pills([["true","Be"],["false","Ki"]],String(cfg.devMode===true),v=>{S.cfg.devMode=v==="true";saveCfg();(()=>{
      if(S.tab!=="settings")return;
      const m=document.getElementById("main");
      const sy=m?m.scrollTop:0;
      m.innerHTML="";
      m.style.padding="20px 22px";
      renderSettings(m);
      setTimeout(()=>{if(m)m.scrollTop=sy;},10);
    })();}));

  // 20. Dev panel
  if(cfg.devMode){
    const dp=el("div","card anim");dp.style.animationDelay=d+"ms";dp.style.borderColor="rgba(255,180,84,.15)";
    dp.innerHTML=`<div style='font-size:11px;font-weight:600;color:var(--am);margin-bottom:10px'>⚙ Developer Options</div>`;
    const dr=el("div","flex gap8 aic");
    const cnI=el("input","inp");cnI.style.width="130px";cnI.value=cfg.codename||"Sequoia";cnI.placeholder="Codename";
    const vI=el("input","inp");vI.style.width="90px";vI.value=cfg.version||"0.1.0";vI.placeholder="0.1.0";
    const chS=el("select","inp");chS.style.fontSize="10px";
    ["release","beta","dev"].forEach(c=>{const o=el("option");o.value=c;o.textContent=c;if(c===cfg.channel)o.selected=true;chS.appendChild(o);});
    const saveB=el("button","btn btn-cy");saveB.style.cssText="font-size:11px;padding:6px 12px";saveB.textContent="💾 Mentés";
    saveB.addEventListener("click",async()=>{
      S.cfg.codename=cnI.value;S.cfg.version=vI.value;S.cfg.channel=chS.value;
      await saveCfg();
      await api("/api/version",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codename:cnI.value,version:vI.value,channel:chS.value})});
      (()=>{
      if(S.tab!=="settings")return;
      const m=document.getElementById("main");
      const sy=m?m.scrollTop:0;
      m.innerHTML="";
      m.style.padding="20px 22px";
      renderSettings(m);
      setTimeout(()=>{if(m)m.scrollTop=sy;},10);
    })();
    });
    dr.appendChild(el("div").appendChild(Object.assign(el("div"),{style:"font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:3px",textContent:"CODENAME"}))&&el("div")||(()=>{const w=el("div");w.innerHTML=`<div style='font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:3px'>CODENAME</div>`;w.appendChild(cnI);return w;})());
    dr.appendChild((()=>{const w=el("div");w.innerHTML=`<div style='font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:3px'>VERSION</div>`;w.appendChild(vI);return w;})());
    dr.appendChild((()=>{const w=el("div");w.innerHTML=`<div style='font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:3px'>CHANNEL</div>`;w.appendChild(chS);return w;})());
    dr.appendChild(saveB);
    dp.appendChild(dr);m.appendChild(dp);
  }
}

// ── Login ──────────────────────────────────────────────────────────
let _lm="login";
$("lmLogin").addEventListener("click",()=>{_lm="login";$("lmLogin").classList.add("on");$("lmReg").classList.remove("on");$("lbtn").textContent="Belépés";});
$("lmReg").addEventListener("click",()=>{_lm="register";$("lmReg").classList.add("on");$("lmLogin").classList.remove("on");$("lbtn").textContent="Fiók létrehozása";});
$("eyeBtn").addEventListener("click",()=>{const p=$("lpw");p.type=p.type==="password"?"text":"password";});
$("lemail").addEventListener("keydown",e=>{if(e.key==="Enter")$("lpw").focus();});
$("lpw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
$("lbtn").addEventListener("click",doLogin);
$("logoutBtn").addEventListener("click",()=>auth.signOut());

async function doLogin(){
  const email=$("lemail").value,pw=$("lpw").value;
  if(!email||!pw){const e=$("lerr");e.textContent="Töltsd ki mindkét mezőt.";e.style.display="block";return;}
  $("lbtn").textContent="...";
  try{
    if(_lm==="login")await auth.signInWithEmailAndPassword(email,pw);
    else await auth.createUserWithEmailAndPassword(email,pw);
  }catch(e){
    const msgs={"auth/invalid-credential":"Hibás email vagy jelszó.","auth/user-not-found":"Nincs ilyen fiók.",
                "auth/wrong-password":"Hibás jelszó.","auth/email-already-in-use":"Foglalt email.",
                "auth/weak-password":"Jelszó min. 6 karakter."};
    const err=$("lerr");err.textContent=msgs[e.code]||e.message;err.style.display="block";
    $("lbtn").textContent=_lm==="login"?"Belépés":"Fiók létrehozása";
  }
}

auth.onAuthStateChanged(async user=>{
  S.user=user;
  if(user){
    $("lo").style.display="none";
    $("barEmail").textContent=user.email||"";
    await loadCfg();
    const ver=await api("/api/version");
    if(ver&&!ver.error){S.cfg.codename=ver.codename;S.cfg.version=ver.version;S.cfg.channel=ver.channel;}
    connectRTDB();
    renderSidebar();renderTab();renderBar();
    checkBridgeStatus();
    _bridgePollInterval = setInterval(checkBridgeStatus, 3000);
    if(S.cfg.autoLoadOfp!==false&&S.cfg.sbUser)loadOFP(S.cfg.sbUser);
    setTimeout(async()=>{
      const u=await api("/api/update");
      if(u&&u.update){
        const b=el("div");b.style.cssText="position:fixed;top:0;left:0;right:0;padding:7px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,180,84,.94);color:#06070c;font-size:11px;font-weight:700;z-index:50;animation:fadeIn var(--mid) var(--ease)";
        b.innerHTML=`🆕 Xdeck EFB ${u.codename||""} elérhető`;
        const btns=el("div","flex gap6");
        if(u.url){const lb=el("button");lb.style.cssText="background:rgba(0,0,0,.15);border:none;border-radius:5px;padding:2px 10px;cursor:pointer;font-size:10px;color:#06070c;font-weight:700";lb.textContent="Letöltés";lb.addEventListener("click",()=>openUrl(u.url));btns.appendChild(lb);}
        const cb=el("button");cb.style.cssText="background:rgba(0,0,0,.12);border:none;border-radius:5px;padding:2px 8px;cursor:pointer;font-size:10px;color:#06070c";cb.textContent="✕";cb.addEventListener("click",()=>b.remove());btns.appendChild(cb);b.appendChild(btns);document.body.appendChild(b);
      }
    },5000);
  }else{
    $("lo").style.display="flex";
  }
});
