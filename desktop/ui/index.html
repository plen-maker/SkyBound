<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<title>Axesta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --bg:#08090e;--panel:#0e1018;--p2:#141720;--line:#1e2535;
  --cy:#5ec8ff;--am:#ffb454;--gn:#52e3b0;--rd:#f06080;--pu:#a78bfa;
  --tx:#d4dff0;--dim:#4a6080;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --ease:cubic-bezier(0.4,0,0.2,1);
  --slow:600ms;--mid:400ms;--fast:200ms;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* ── Layout ── */
.app{height:100vh;display:flex;flex-direction:column}
.body{display:flex;flex:1;overflow:hidden}
.main{flex:1;overflow:auto;padding:20px}

/* ── Titlebar ── */
.bar{height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.bar-left{display:flex;align-items:center;gap:12px}
.logo-icon{width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--cy),var(--pu));
  display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:13px;height:13px;stroke:#08090e;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.logo-name{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--tx)}
.logo-sub{font-size:9px;color:var(--dim);margin-top:1px}
.bar-right{display:flex;align-items:center;gap:14px}
.bar-stat{text-align:right}
.bar-stat-l{font-size:7px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.bar-stat-v{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--dim)}
.bar-stat-v.live{color:var(--tx)}
.bar-stat-v sub{font-size:7px;color:var(--dim);margin-left:1px}
.sep{width:1px;height:20px;background:var(--line)}
.live-pill{display:flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;
  font-size:9px;font-weight:600;letter-spacing:.5px;
  background:rgba(90,112,144,.06);border:1px solid rgba(90,112,144,.12);color:var(--dim);
  transition:all var(--slow) var(--ease)}
.live-pill.on{background:rgba(82,227,176,.07);border-color:rgba(82,227,176,.18);color:var(--gn)}
.live-dot{width:4px;height:4px;border-radius:50%;background:currentColor;
  transition:background var(--slow) var(--ease)}
.live-pill.on .live-dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.bar-email{font-size:9px;color:var(--dim)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--dim);
  padding:5px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:color var(--fast) var(--ease),background var(--fast) var(--ease)}
.icon-btn:hover{color:var(--tx);background:var(--p2)}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Sidebar ── */
.sidebar{width:70px;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;padding:8px 4px;gap:1px;flex-shrink:0}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0;border-radius:9px;cursor:pointer;color:var(--dim);
  border:none;background:transparent;width:100%;font-family:var(--font);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease)}
.nav:hover{background:var(--p2);color:var(--tx)}
.nav.on{background:var(--p2);color:var(--cy);box-shadow:inset 2px 0 0 var(--cy)}
.nav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav span{font-size:8px;letter-spacing:.4px;font-weight:600}
.spacer{flex:1}

/* ── Cards ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.card-sm{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sl{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);
  transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease)}
.btn:active{transform:scale(0.97)}
.btn-cy{background:var(--cy);color:#08090e}
.btn-dk{background:var(--p2);color:var(--dim);border:1px solid var(--line);font-weight:600}
.btn-dk:hover{color:var(--tx);border-color:var(--dim)}
.pill{border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--p2);color:var(--dim);font-family:var(--font);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
             border-color var(--fast) var(--ease)}
.pill:hover{background:var(--panel);color:var(--tx)}
.pill.on{background:var(--cy);color:#08090e;border-color:var(--cy)}

/* ── Input ── */
.inp{background:var(--p2);border:1px solid var(--line);color:var(--tx);
  font-size:13px;border-radius:8px;padding:7px 10px;font-family:var(--font);outline:none;
  transition:border-color var(--fast) var(--ease)}
.inp:focus{border-color:var(--cy)}

/* ── Data rows ── */
.drow{display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.dl{font-size:11px;color:var(--tx)}.dv{font-size:11px;font-variant-numeric:tabular-nums}

/* ── Grids ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── Shortcut tile ── */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px;cursor:pointer;text-align:left;width:100%;font-family:var(--font);
  transition:background var(--mid) var(--ease),border-color var(--mid) var(--ease)}
.tile:hover{background:var(--p2);border-color:rgba(94,200,255,.2)}
.tile-ic{width:28px;height:28px;border-radius:7px;background:var(--p2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.tile-ic svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile-nm{font-size:11px;font-weight:600;color:var(--tx);margin-bottom:1px}
.tile-sb{font-size:9px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Stat cards ── */
.sc{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  transition:border-color var(--slow) var(--ease)}
.sc.live{border-color:rgba(94,200,255,.15)}
.sc-l{font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.sc-v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);
  transition:color var(--slow) var(--ease)}
.sc-v.live{color:var(--tx)}
.sc-v sub{font-size:8px;color:var(--dim);margin-left:2px;vertical-align:middle}

/* ── Alerts ── */
.warn{display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 12px;font-size:11px;
  background:rgba(255,180,84,.04);border:1px solid rgba(255,180,84,.12);color:var(--am);margin-bottom:8px}
.err{display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 12px;font-size:11px;
  background:rgba(240,96,128,.05);border:1px solid rgba(240,96,128,.15);color:var(--rd);margin-bottom:8px}

/* ── VATSIM ── */
.vitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:5px;cursor:pointer;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.vitem:hover{background:var(--p2)}
.fbadge{border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700;display:inline-block}
.atis-body{margin-top:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;font-size:10px;color:var(--dim);line-height:1.7;display:none}
.atis-body.open{display:block}

/* ── Settings rows ── */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;margin-bottom:6px}
.slabel{font-size:12px;color:var(--tx)}.sdesc{font-size:9px;color:var(--dim);margin-top:2px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;padding:0;
  transition:transform var(--mid) var(--ease),box-shadow var(--mid) var(--ease)}
.swatch:hover{transform:scale(1.15)}
.swatch.on{transform:scale(1.1)}

/* ── Built-in browser ── */
#browser{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:var(--bg)}
#browser.open{display:flex}
.br-bar{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.br-btn{background:var(--p2);border:1px solid var(--line);color:var(--tx);
  border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;font-family:var(--font)}
.br-url{flex:1;background:var(--p2);border:1px solid var(--line);border-radius:6px;
  padding:3px 10px;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brFrame{flex:1;border:none}

/* ── Login ── */
#lo{position:fixed;inset:0;background:radial-gradient(ellipse at 35% 25%,#0e1628,var(--bg) 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:999}
.lo-icon{width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,var(--cy),var(--pu));
  display:flex;align-items:center;justify-content:center}
.lo-icon svg{width:26px;height:26px;stroke:#08090e;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lo-title{font-size:26px;font-weight:700;letter-spacing:.3px}
.lo-sub{font-size:11px;color:var(--dim);margin-top:3px;text-align:center}

/* ── Map wrap ── */
.map-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--line)}

/* ── Flex utils ── */
.flex{display:flex}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.aic{align-items:center}.jb{justify-content:space-between}.f1{flex:1}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}
</style>
</head>
<body>

<!-- Browser overlay -->
<div id="browser">
  <div class="br-bar">
    <button class="br-btn" id="brBack">←</button>
    <button class="br-btn" id="brFwd">→</button>
    <button class="br-btn" id="brRld">↺</button>
    <div class="br-url" id="brUrl"></div>
    <button class="br-btn" id="brClose">✕ Bezár</button>
  </div>
  <iframe id="brFrame" src="about:blank"></iframe>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="bar">
    <div class="bar-left">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      </div>
      <div>
        <div class="logo-name">AXESTA</div>
        <div class="logo-sub" id="barSub">no OFP · —</div>
      </div>
    </div>
    <div class="bar-right">
      <div class="bar-stat"><div class="bar-stat-l">GS</div><div class="bar-stat-v" id="sGs">—</div></div>
      <div class="bar-stat"><div class="bar-stat-l">ALT</div><div class="bar-stat-v" id="sAlt">—</div></div>
      <div class="bar-stat"><div class="bar-stat-l">UTC</div><div class="bar-stat-v live" id="sUtc">—</div></div>
      <div class="sep"></div>
      <div class="live-pill" id="livePill"><div class="live-dot"></div><span>SIM</span></div>
      <div class="bar-email" id="barEmail">—</div>
      <button class="icon-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar" id="sb"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<!-- Login -->
<div id="lo">
  <div class="lo-icon">
    <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
  </div>
  <div style="text-align:center">
    <div class="lo-title">AXESTA</div>
    <div class="lo-sub">Electronic Flight Bag · MSFS 2020/2024</div>
  </div>
  <div class="flex gap6" id="lmBtns">
    <button class="pill on" id="lmLogin">Belépés</button>
    <button class="pill" id="lmReg">Regisztráció</button>
  </div>
  <div style="width:300px;display:flex;flex-direction:column;gap:9px">
    <input class="inp" id="lemail" type="email" placeholder="Email" style="width:100%"/>
    <div style="position:relative">
      <input class="inp" id="lpw" type="password" placeholder="Jelszó" style="width:100%;padding-right:36px"/>
      <button id="eyeBtn" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--dim);font-size:14px">👁</button>
    </div>
    <div id="lerr" style="color:var(--rd);font-size:11px;display:none"></div>
    <button class="btn btn-cy" id="lbtn" style="width:100%;justify-content:center;font-size:13px;padding:10px">Belépés</button>
  </div>
  <div style="font-size:10px;color:var(--dim);text-align:center;max-width:240px;line-height:1.7">
    Ez a fiók köti össze a desktopot, a telefont és a sim bridge-et.
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAxHmLWOIJl4xC44uHsRbxqzRhF4mA0kqE",
  authDomain:"simapp-99f40.firebaseapp.com",
  databaseURL:"https://simapp-99f40-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"simapp-99f40",messagingSenderId:"993511543138",
  appId:"1:993511543138:web:ec3a0d3e19713160111c3b"
});
const auth=firebase.auth(), db=firebase.database();

// ── State ──────────────────────────────────────────────────────────
const S={
  tab:"home",user:null,
  cfg:{sbUser:"ddnemet",fenixUrl:"",sessionCode:"ddnemet-host",
       openLinksInApp:false,ofpMode:"simplified",theme:"dark"},
  ofp:null,live:null,rtdb:false,triggers:[],vd:null,
  ofpLoading:false,ofpErr:"",
  ver:{codename:"Sequoia",version:"0.1.0",channel:"release"},
};

// ── Themes ─────────────────────────────────────────────────────────
const TH={
  dark:    {bg:"#08090e",panel:"#0e1018",p2:"#141720",line:"#1e2535",tx:"#d4dff0",dim:"#4a6080",cy:"#5ec8ff",am:"#ffb454",gn:"#52e3b0",rd:"#f06080"},
  midnight:{bg:"#000005",panel:"#08090f",p2:"#0c0f18",line:"#141c2a",tx:"#c8d8f0",dim:"#3a5070",cy:"#5ec8ff",am:"#ffb454",gn:"#52e3b0",rd:"#f06080"},
  navy:    {bg:"#08091a",panel:"#0d1028",p2:"#121530",line:"#1c2340",tx:"#c8d4f0",dim:"#3a5078",cy:"#4db8ff",am:"#ffaa33",gn:"#33ddaa",rd:"#ff4466"},
  green:   {bg:"#060e09",panel:"#0a1410",p2:"#0e1a14",line:"#162a1e",tx:"#c4e0d0",dim:"#3a6050",cy:"#33e899",am:"#ffcc44",gn:"#44ff88",rd:"#ff4455"},
  amber:   {bg:"#0e0a04",panel:"#161005",p2:"#1c1608",line:"#2e2008",tx:"#ead8a8",dim:"#705840",cy:"#ffaa22",am:"#ff8822",gn:"#88cc44",rd:"#ff4444"},
  light:   {bg:"#eef2f8",panel:"#e6ecf4",p2:"#dce4ee",line:"#c8d4e2",tx:"#0a1828",dim:"#486080",cy:"#0880c0",am:"#a05800",gn:"#088060",rd:"#b02840"},
};
function applyTheme(n){
  const t=TH[n]||TH.dark,r=document.documentElement;
  Object.entries(t).forEach(([k,v])=>r.style.setProperty("--"+k,v));
}

const $=id=>document.getElementById(id);
const api=(p,o={})=>fetch(p,o).then(r=>r.json()).catch(e=>({error:e.message}));
const fmt=(v,u="")=>v==null?"—":`${typeof v==="number"?Math.round(v).toLocaleString("hu"):v}${u?" "+u:""}`;
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};

const IFRAME_BLOCKED=["music.youtube.com","discord.com","open.spotify.com","youtube.com","twitter.com","instagram.com"];
function openBrowser(url){
  const blocked=IFRAME_BLOCKED.some(d=>url.includes(d));
  if(blocked||S.cfg.openLinksInApp===false){
    window.open(url,"_blank"); return;
  }
  $("brFrame").src=url; $("brUrl").textContent=url;
  $("browser").classList.add("open");
}
$("brClose").addEventListener("click",()=>{ $("browser").classList.remove("open"); $("brFrame").src="about:blank"; });
$("brBack").addEventListener("click",()=>{ try{$("brFrame").contentWindow.history.back();}catch{} });
$("brFwd").addEventListener("click",()=>{ try{$("brFrame").contentWindow.history.forward();}catch{} });
$("brRld").addEventListener("click",()=>{ $("brFrame").src=$("brFrame").src; });

// ── Settings ───────────────────────────────────────────────────────
async function loadCfg(){
  try{ const s=await api("/api/settings"); if(s&&!s.error)Object.assign(S.cfg,s); }catch{}
  applyTheme(S.cfg.theme);
}
async function saveCfg(){ applyTheme(S.cfg.theme); await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S.cfg)}); }

// ── UTC ────────────────────────────────────────────────────────────
setInterval(()=>{ const u=$("sUtc"); if(u){const f=new Date().toUTCString();u.textContent=f.slice(17,22)+"z";} },1000);

// ── OFP ───────────────────────────────────────────────────────────
async function loadOFP(u){
  const un=(u||S.cfg.sbUser||"").trim();
  if(!un){S.ofpErr="Adj meg SimBrief usernevet.";renderTab();return;}
  S.ofpLoading=true;S.ofpErr="";renderTab();
  const r=await api("/api/ofp?username="+encodeURIComponent(un));
  if(r.error) S.ofpErr=r.error;
  else{ S.ofp=r.ofp; S.cfg.sbUser=un; saveCfg(); }
  S.ofpLoading=false;renderTab();renderBar();
}

async function loadVatsim(){
  S.vd=null;renderTab();
  S.vd=await api("/api/vatsim");renderTab();
}

// ── RTDB ──────────────────────────────────────────────────────────
let _uns=[];
function connectRTDB(){
  _uns.forEach(u=>u());_uns=[];
  const sc=S.cfg.sessionCode;if(!sc)return;
  let lt;
  const r1=db.ref("sessions/"+sc+"/live");
  r1.on("value",s=>{clearTimeout(lt);lt=setTimeout(()=>{S.live=s.val();renderBar();},300);},()=>{});
  _uns.push(()=>r1.off());
  const r2=db.ref(".info/connected");
  r2.on("value",s=>{S.rtdb=s.val()===true;renderBar();},()=>{});
  _uns.push(()=>r2.off());
  const r3=db.ref("sessions/"+sc+"/triggers");
  r3.on("value",s=>{const v=s.val();S.triggers=v?Object.entries(v).map(([id,d])=>({id,...d})):[];if(S.tab==="alerts")renderTab();},()=>{});
  _uns.push(()=>r3.off());
}

// ── Bar ────────────────────────────────────────────────────────────
function renderBar(){
  const {ofp,live,rtdb}=S;
  const bs=$("barSub");if(bs)bs.textContent=(ofp?`${ofp.dep||"?"}→${ofp.arr||"?"}`:"no OFP")+" · "+S.cfg.sessionCode;
  const gs=$("sGs");if(gs){gs.innerHTML=live?`${Math.round(live.gsKt)}<sub>kt</sub>`:"—";gs.className="bar-stat-v"+(live?" live":"");}
  const al=$("sAlt");if(al){al.innerHTML=live?`${Math.round(live.altFt).toLocaleString()}<sub>ft</sub>`:"—";al.className="bar-stat-v"+(live?" live":"");}
  const p=$("livePill");if(!p)return;
  p.className="live-pill"+(rtdb&&live?" on":"");
  p.innerHTML="<div class='live-dot'></div><span>"+(rtdb&&live?"LIVE":"SIM")+"</span>";
}

// ── Sidebar ────────────────────────────────────────────────────────

  {id:"home",l:"Home",svg:"<polygon points='3 9 12 2 21 9 21 20 3 20'/>"},

function renderSidebar(){
  const sb=$("sb");if(!sb)return;
  sb.innerHTML="";
  TABS.forEach(t=>{
    const b=el("button","nav"+(S.tab===t.id?" on":""));
    b.innerHTML=`<svg viewBox='0 0 24 24'>${t.svg}</svg><span>${t.l}</span>`;
    b.addEventListener("click",()=>navTo(t.id));

function navTo(tab){S.tab=tab;renderSidebar();renderTab();}

function renderTab(){
  const m=$("main");if(!m)return;
  if(S.tab==="map"&&$("leafletMap"))return;
  if(S.tab!=="map")window._lfMap=null;
  m.innerHTML="";m.style.padding="20px";m.style.overflow="auto";
  ({home:renderHome,map:renderMap,ofp:renderOFP,vatsim:renderVatsim,
    charts:renderCharts,alerts:renderAlerts,ctrl:renderCtrl,settings:renderSettings})[S.tab]?.(m);
}

function renderHome(m){
  const {live,ofp,cfg}=S;
  if(!live){const w=el("div","warn");w.innerHTML="⚠ Sim bridge nincs csatlakoztatva";m.appendChild(w);}
  const sg=el("div","g4");sg.style.marginBottom="14px";
  [["ETE",live&&live.destEteMin!=null?`${Math.floor(live.destEteMin/60)}:${String(Math.round(live.destEteMin)%60).padStart(2,"0")}`:"—","h:m"],
   ["GS", live&&live.gsKt!=null?String(Math.round(live.gsKt)):"—","kt"],
   ["ALT",live&&live.altFt!=null?Math.round(live.altFt).toLocaleString():"—","ft"],
   ["V/S",live&&live.vsFpm!=null?String(Math.round(live.vsFpm)):"—","fpm"]].forEach(([l,v,u])=>{
    const c=el("div","sc"+(v!=="—"?" live":""));
    c.innerHTML=`<div class='sc-l'>${l}</div><div class='sc-v${v!=="—"?" live":""}'>${v!=="—"?v+"<sub>"+u+"</sub>":"—"}</div>`;
    sg.appendChild(c);
  });
  m.appendChild(sg);
  const slb=el("div","sl");slb.textContent="Shortcuts";m.appendChild(slb);
  const cols=S.cfg.layout==="2"?"g2":"g4";const grid=el("div",cols);grid.style.marginBottom="14px";
  SC.forEach(s=>{
    const url=s.uk?cfg[s.uk]:s.url,dis=s.uk&&!url;
    const tile=el("button","tile");tile.style.opacity=dis?"0.4":"1";if(dis)tile.disabled=true;
    const ic=el("div","tile-ic");ic.style.color=s.c;
    ic.innerHTML=`<svg viewBox='0 0 24 24'>${s.ic}</svg>`;
    const nm=el("div","tile-nm");nm.textContent=s.n;
    const sb2=el("div","tile-sb");sb2.textContent=dis?"⚙ állítsd be →":s.s;
    tile.appendChild(ic);tile.appendChild(nm);tile.appendChild(sb2);
    if(!dis)tile.addEventListener("click",()=>openBrowser(url));
    grid.appendChild(tile);
  });
  m.appendChild(grid);
  const bot=el("div","flex gap8");
  // Map
  const fixes=(ofp?.fixes||[]).filter(f=>f.lat!=null);
  const W=600,H=190,pd=36;let svg="";
  if(fixes.length||live){
    const pts=[...fixes,...(live&&live.lat!=null?[{lat:live.lat,lon:live.lon}]:[])];
    const la0=Math.min(...pts.map(p=>p.lat)),la1=Math.max(...pts.map(p=>p.lat));
    const lo0=Math.min(...pts.map(p=>p.lon)),lo1=Math.max(...pts.map(p=>p.lon));
    const sx=lon=>pd+(lo1===lo0?.5:(lon-lo0)/(lo1-lo0))*(W-2*pd);
    const sy=lat=>pd+(la1===la0?.5:1-(lat-la0)/(la1-la0))*(H-2*pd);
    if(fixes.length>1)svg+=`<polyline points='${fixes.map(f=>`${sx(f.lon)},${sy(f.lat)}`).join(" ")}' fill='none' stroke='#5ec8ff' stroke-opacity='.4' stroke-width='1.5' stroke-dasharray='5 4'/>`;
    fixes.forEach((f,i)=>{
      if(!(i===0||i===fixes.length-1||i%Math.max(1,Math.floor(fixes.length/5))===0))return;
      svg+=`<circle cx='${sx(f.lon)}' cy='${sy(f.lat)}' r='${i===0||i===fixes.length-1?5:2.5}' fill='${i===0?"#52e3b0":i===fixes.length-1?"#f06080":"#2a5080"}'/>`;
    });
    if(live&&live.lat!=null)svg+=`<g transform='translate(${sx(live.lon)},${sy(live.lat)})'><path d='M0,-9 L5,7 L0,3 L-5,7 Z' fill='white' stroke='#5ec8ff' stroke-width='1.5'/></g>`;
  }
  const md=el("div");md.style.flex="2";
  md.innerHTML=`<div class='map-wrap'><svg viewBox='0 0 ${W} ${H}' style='width:100%;height:${H}px;display:block;background:#0a1520'>${svg||`<text x='${W/2}' y='${H/2}' fill='#2a4060' font-size='11' text-anchor='middle'>Nincs OFP / bridge</text>`}</svg></div>`;
  const od=el("div","card");od.style.flex="1";od.style.marginBottom="0";
  const sl2=el("div","sl");sl2.textContent="SimBrief";od.appendChild(sl2);
  if(ofp){
    [["PAX",fmt(ofp.pax)],["Payload",fmt(ofp.payload)+" "+ofp.units],
     ["Block",fmt(ofp.blockFuel)+" "+ofp.units],["CI",fmt(ofp.costindex)]].forEach(([l,v])=>{
      const r=el("div","drow");r.innerHTML=`<span class='dl'>${l}</span><span class='dv'>${v}</span>`;od.appendChild(r);
    });
  }else{const nd=el("div");nd.style.cssText="font-size:11px;color:var(--dim)";nd.textContent="Nincs OFP betöltve.";od.appendChild(nd);}
  bot.appendChild(md);bot.appendChild(od);m.appendChild(bot);
}

// ── MAP ────────────────────────────────────────────────────────────
function renderMap(m){
  m.style.padding="0";m.style.overflow="hidden";
  const d=el("div");d.id="leafletMap";d.style.cssText="width:100%;height:calc(100vh - 50px)";m.appendChild(d);
  if(!document.getElementById("lf-css")){
    const l=document.createElement("link");l.id="lf-css";l.rel="stylesheet";
    l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(l);}
  const init=()=>{
    if(window._lfMap)return;
    const fixes=(S.ofp?.fixes||[]).filter(f=>f.lat!=null);
    const center=S.live&&S.live.lat?[S.live.lat,S.live.lon]:fixes.length?[fixes[Math.floor(fixes.length/2)].lat,fixes[Math.floor(fixes.length/2)].lon]:[47.4,19.26];
    const map=L.map("leafletMap",{zoomControl:true,attributionControl:false}).setView(center,7);
    window._lfMap=map;
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,opacity:.6}).addTo(map);
    if(fixes.length>1){
      L.polyline(fixes.map(f=>[f.lat,f.lon]),{color:"#5ec8ff",weight:2,dashArray:"7,5",opacity:.7}).addTo(map);
      fixes.forEach((f,i)=>{
        if(!(i===0||i===fixes.length-1||i%Math.max(1,Math.floor(fixes.length/8))===0))return;
        L.circleMarker([f.lat,f.lon],{radius:i===0||i===fixes.length-1?6:3,
          color:i===0?"#52e3b0":i===fixes.length-1?"#f06080":"#5ec8ff",
          fillColor:i===0?"#52e3b0":i===fixes.length-1?"#f06080":"#1a4070",fillOpacity:1,weight:2}).bindTooltip(f.ident).addTo(map);
      });
    }
    if(S.live&&S.live.lat){
      const ic=L.divIcon({html:`<svg viewBox='0 0 24 24' width='20' height='20'><path d='M12 2 L16 17 L12 13 L8 17 Z' fill='white' stroke='#5ec8ff' stroke-width='1.5'/></svg>`,iconSize:[20,20],iconAnchor:[10,10],className:""});
      L.marker([S.live.lat,S.live.lon],{icon:ic}).addTo(map);
    }
  };
  if(window.L)init();
  else{const s=document.createElement("script");s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";s.onload=init;document.head.appendChild(s);}
}

function renderOFP(m){

    const b=el("button","pill"+(cfg.ofpMode===v?" on":""));b.textContent=v==="simplified"?"Simplified":"Realistic";
    b.addEventListener("click",()=>{S.cfg.ofpMode=v;saveCfg();renderTab();});modes.appendChild(b);
  });
  hdr.appendChild(sl);hdr.appendChild(modes);m.appendChild(hdr);
  const card=el("div","card");
  const lbl=el("div");lbl.style.cssText="font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px";lbl.textContent="Simbrief usernév";
  const row=el("div","flex gap8 aic");
  const inp=el("input","inp f1");inp.placeholder="pl. ddnemet";inp.value=cfg.sbUser||"";
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")loadOFP(inp.value);});
  const lb=el("button","btn btn-cy");lb.textContent=ofpLoading?"↻...":"📄 Betölt";
  lb.addEventListener("click",()=>loadOFP(inp.value));
  row.appendChild(inp);row.appendChild(lb);
  if(cfg.sbUser){const pb=el("button","btn btn-dk");pb.textContent="↗ PDF";pb.addEventListener("click",()=>openBrowser(`https://www.simbrief.com/api/xml.fetcher.php?username=${cfg.sbUser}&type=pdf`));row.appendChild(pb);}
  card.appendChild(lbl);card.appendChild(row);m.appendChild(card);
  if(ofpErr){const e=el("div","err");e.textContent="⚠ "+ofpErr;m.appendChild(e);}
  if(!ofp)return;
  if(cfg.ofpMode==="simplified"){
    const c=el("div","card");
    const title=el("div");title.style.cssText="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:6px";
    title.textContent=`${ofp.dep||"?"}→${ofp.arr||"?"}${ofp.altn?" /"+ofp.altn:""}`;
    const ac=el("div");ac.style.cssText="font-size:10px;color:var(--dim);margin-bottom:12px";ac.textContent=ofp.aircraft||"";
    const g=el("div","g2");g.style.gap="6px";

     ["ZFW",fmt(ofp.zfw)+" "+ofp.units],["TOW",fmt(ofp.tow)+" "+ofp.units],
     ["Block",fmt(ofp.blockFuel)+" "+ofp.units],["CI",fmt(ofp.costindex)],
     ["Dist",fmt(ofp.routeDistanceNm)+" nm"],["ETE",ofp.ete||"—"]].forEach(([l,v])=>{
      const d2=el("div");d2.style.cssText="display:flex;justify-content:space-between;padding:6px 9px;background:var(--p2);border-radius:7px;border:1px solid var(--line)";
      d2.innerHTML=`<span style='font-size:10px;color:var(--dim)'>${l}</span><span style='font-size:11px;font-variant-numeric:tabular-nums'>${v}</span>`;
      g.appendChild(d2);
    });
    c.appendChild(title);c.appendChild(ac);c.appendChild(g);m.appendChild(c);
  }else{
    const tabs=el("div","flex gap6 mt8");
    ["weights","fuel","route","navlog"].forEach(k=>{
      const b=el("button","pill"+(_ofpSec===k?" on":""));b.textContent={weights:"Weights",fuel:"Fuel",route:"Route",navlog:"Navlog"}[k];
      b.addEventListener("click",()=>{_ofpSec=k;renderTab();});tabs.appendChild(b);
    });
    m.appendChild(tabs);
    const c=el("div","card mt8");
    if(_ofpSec==="weights")
      [["PAX",fmt(ofp.pax)],["Payload",fmt(ofp.payload)+" "+ofp.units],
       ["ZFW",fmt(ofp.zfw)+" "+ofp.units],["TOW",fmt(ofp.tow)+" "+ofp.units],
       ["CI",fmt(ofp.costindex)]].forEach(([l,v])=>{
        const r=el("div","drow");r.innerHTML=`<span class='dl'>${l}</span><span class='dv'>${v}</span>`;c.appendChild(r);
      });
    else if(_ofpSec==="fuel")
      [["Block",fmt(ofp.blockFuel)+" "+ofp.units,"var(--am)"],
       ["Trip",fmt(ofp.enrouteBurn)+" "+ofp.units],["Contingency",fmt(ofp.contFuel)+" "+ofp.units],
       ["Alternate",fmt(ofp.altFuel)+" "+ofp.units],["Reserve",fmt(ofp.resFuel)+" "+ofp.units],

  }

    const fac=FAC[c.facility]||"CTR",fc=FC[fac]||"#4a6080",at=am[c.callsign];

    const freq=el("div");freq.style.cssText="font-size:12px;color:var(--am);font-variant-numeric:tabular-nums;flex-shrink:0";freq.textContent=c.frequency;

    const b=el("button","pill");b.textContent=ic+" "+["DEP","ARR","ALTN"][i];
    b.style.color=["var(--gn)","var(--cy)","var(--am)"][i];
    b.addEventListener("click",()=>{_chartIcao=ic;inp.value=ic;});qr.appendChild(b);
  });
  card.appendChild(qr);m.appendChild(card);
  const grid=el("div","g2 mt8");
  [{n:"MSFS Flight Planner",d:"Microsoft Lido chartok",c:"var(--cy)",b:"MSFS",url:"https://planner.flightsimulator.com/"},
   {n:"Navigraph Charts",d:"Jeppesen-stílusú chartok",c:"var(--pu)",b:"Előfizetéses",url:"https://charts.navigraph.com"}].forEach(p=>{
    const tile=el("button","tile");
    tile.innerHTML=`<div style='display:flex;justify-content:space-between;margin-bottom:9px'>
      <div class='tile-ic' style='color:${p.c};width:30px;height:30px'><svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='10'/><line x1='2' y1='12' x2='22' y2='12'/><path d='M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'/></svg></div>
      <span style='border-radius:99px;padding:2px 7px;font-size:9px;font-weight:700;background:rgba(128,128,128,.1);border:1px solid rgba(128,128,128,.2);color:${p.c}'>${p.b}</span>
    </div>
    <div style='font-size:12px;font-weight:600;margin-bottom:3px'>${p.n}</div>
    <div style='font-size:10px;color:var(--dim)'>${p.d}</div>`;
    tile.addEventListener("click",()=>openBrowser(p.url));grid.appendChild(tile);
  });
  m.appendChild(grid);
}

// ── ALERTS ────────────────────────────────────────────────────────
let _trigKind="fix";
function renderAlerts(m){
  const sl=el("div","sl");sl.textContent="Push Triggers";m.appendChild(sl);
  const card=el("div","card");
  const kr=el("div","flex gap6");kr.style.marginBottom="10px";
  ["fix","tod","dest"].forEach(k=>{
    const b=el("button","pill"+(_trigKind===k?" on":""));b.textContent={fix:"Fix",tod:"T/D",dest:"Landing"}[k];
    b.addEventListener("click",()=>{_trigKind=k;renderTab();});kr.appendChild(b);
  });
  const ar=el("div","flex gap8 aic");
  let fixInp=null;
  if(_trigKind==="fix"){fixInp=el("input","inp f1");fixInp.placeholder="pl. VETIK";ar.appendChild(fixInp);}
  else{const sp=el("div","f1");ar.appendChild(sp);}
  const leadInp=el("input","inp");leadInp.style.width="68px";leadInp.value="5";leadInp.type="number";
  const ab=el("button","btn btn-cy");ab.textContent="＋ Arm";
  ab.addEventListener("click",()=>{
    const t={armed:true,kind:_trigKind,lead:Number(leadInp.value)||5};
    if(_trigKind==="fix"){if(fixInp)t.fix=fixInp.value.toUpperCase().trim();if(!t.fix)return;}
    db.ref("sessions/"+S.cfg.sessionCode+"/triggers").push(t);
  });
  ar.appendChild(leadInp);ar.appendChild(ab);card.appendChild(kr);card.appendChild(ar);m.appendChild(card);
  if(!S.triggers.length){const nd=el("div");nd.style.cssText="text-align:center;padding:24px;color:var(--dim);font-size:11px";nd.textContent="Nincs trigger.";m.appendChild(nd);}
  S.triggers.forEach(t=>{
    const item=el("div","vitem flex aic jb");item.style.marginTop="5px";
    const bb=el("button","btn btn-dk");bb.style.cssText="width:28px;height:28px;padding:0;justify-content:center;color:"+(t.armed?"var(--cy)":"var(--dim)");bb.textContent="🔔";
    bb.addEventListener("click",()=>db.ref("sessions/"+S.cfg.sessionCode+"/triggers/"+t.id).update({armed:!t.armed}));
    const info=el("div");info.style.cssText="flex:1;margin:0 10px";
    const ttl=el("div");ttl.style.cssText="font-size:12px;font-weight:600;font-variant-numeric:tabular-nums";ttl.innerHTML=(t.kind==="fix"?t.fix:t.kind.toUpperCase())+` <span style='color:var(--dim);font-weight:400'>− ${t.lead} min</span>`;
    const st=el("div");st.style.cssText="font-size:9px;color:"+(t.armed?(t.fired?"var(--gn)":"var(--cy)"):"var(--dim)");st.textContent=t.armed?(t.fired?"✓ fired":"armed"):"off";
    const del=el("button","btn btn-dk");del.style.cssText="width:28px;height:28px;padding:0;justify-content:center;color:var(--rd)";del.textContent="✕";
    del.addEventListener("click",()=>db.ref("sessions/"+S.cfg.sessionCode+"/triggers/"+t.id).remove());
    info.appendChild(ttl);info.appendChild(st);item.appendChild(bb);item.appendChild(info);item.appendChild(del);m.appendChild(item);
  });
}

// ── CTRL ──────────────────────────────────────────────────────────
function renderCtrl(m){
  const sl=el("div","sl");sl.textContent="Controller Axis Mapping";m.appendChild(sl);
  const gps=Array.from(navigator.getGamepads?.()??[]).filter(Boolean);
  if(!gps.length){const w=el("div","warn");w.textContent="Nem található gamepad / HOTAS.";m.appendChild(w);return;}
  const LABELS=["Roll","Pitch","Throttle L","Throttle R","Rudder","Tiller","Flaps","Brakes"];
  gps.forEach(gp=>{
    const card=el("div","card");
    const t=el("div");t.style.cssText="font-weight:600;font-size:12px;margin-bottom:9px;color:var(--tx)";t.textContent=gp.id.slice(0,50);card.appendChild(t);
    Array.from(gp.axes).forEach((v,i)=>{
      const row=el("div","drow flex aic gap8");
      const lbl=el("span");lbl.style.cssText="font-size:9px;color:var(--dim);width:22px;font-variant-numeric:tabular-nums";lbl.textContent="A"+i;
      const bar=el("div");bar.style.cssText="width:72px;height:3px;background:var(--p2);border-radius:99px;overflow:hidden";
      const fill=el("div");fill.style.cssText=`width:${Math.round((v+1)/2*100)}%;height:100%;background:var(--cy);border-radius:99px`;bar.appendChild(fill);
      const val=el("span");val.style.cssText="font-size:9px;color:var(--cy);width:32px;font-variant-numeric:tabular-nums";val.textContent=v.toFixed(2);
      const sel=el("select","inp f1");sel.style.fontSize="10px";sel.innerHTML="<option>— nincs —</option>"+LABELS.map(l=>"<option>"+l+"</option>").join("");
      row.appendChild(lbl);row.appendChild(bar);row.appendChild(val);row.appendChild(sel);card.appendChild(row);
    });
    m.appendChild(card);
  });
}

// ── SETTINGS ──────────────────────────────────────────────────────
function renderSettings(m){
  const {cfg,ver}=S;
  const sl=el("div","sl");sl.textContent="Settings";m.appendChild(sl);

  function srow(label,desc,content){
    const row=el("div","srow");
    const left=el("div");
    const lbl=el("div","slabel");lbl.textContent=label;left.appendChild(lbl);
    if(desc){const d=el("div","sdesc");d.textContent=desc;left.appendChild(d);}
    row.appendChild(left);row.appendChild(content);m.appendChild(row);
  }

  // Theme
  const sw=el("div","flex gap8 aic");
  [["dark","#08090e","#5ec8ff"],["midnight","#000005","#5ec8ff"],["navy","#08091a","#4db8ff"],
   ["green","#060e09","#33e899"],["amber","#0e0a04","#ffaa22"],["light","#eef2f8","#0880c0"]].forEach(([v,bg,ac])=>{
    const s=el("button","swatch"+(cfg.theme===v?" on":""));s.title=v;
    s.style.cssText=`background:linear-gradient(135deg,${bg} 50%,${ac} 50%);border:${cfg.theme===v?"3px solid "+ac:"2px solid var(--line)"};box-shadow:${cfg.theme===v?"0 0 7px "+ac+"66":"none"}`;
    s.addEventListener("click",()=>{S.cfg.theme=v;applyTheme(v);saveCfg();if(S.tab==="settings")renderTab();});sw.appendChild(s);
  });
  srow("Téma","",sw);

  const sbRow=el("div","flex gap8 aic");
  const sbInp=el("input","inp");sbInp.style.width="170px";sbInp.value=cfg.sbUser||"";sbInp.placeholder="pl. ddnemet";
  sbInp.addEventListener("change",()=>{S.cfg.sbUser=sbInp.value;saveCfg();});
  const sbBtn=el("button","btn btn-cy");sbBtn.style.cssText="font-size:11px;padding:6px 12px";sbBtn.textContent="Betölt";
  sbBtn.addEventListener("click",()=>{S.cfg.sbUser=sbInp.value;loadOFP(sbInp.value);});
  sbRow.appendChild(sbInp);sbRow.appendChild(sbBtn);
  srow("SimBrief usernév","Automatikusan betölti az OFP-t induláskor",sbRow);

  const fxInp=el("input","inp");fxInp.style.width="220px";fxInp.value=cfg.fenixUrl||"";fxInp.placeholder="http://192.168.1.x:8080";
  fxInp.addEventListener("change",()=>{S.cfg.fenixUrl=fxInp.value;saveCfg();});
  srow("Fenix EFB cím","Csak ha fut a Fenix EFB a szimulátorban",fxInp);

  const scInp=el("input","inp");scInp.style.width="160px";scInp.value=cfg.sessionCode||"";scInp.placeholder="ddnemet-host";
  scInp.addEventListener("change",()=>{S.cfg.sessionCode=scInp.value;saveCfg();connectRTDB();});
  srow("Session kód","Firebase sync azonosító",scInp);

  const omRow=el("div","flex gap6");
  [["simplified","Simplified"],["realistic","Realistic"]].forEach(([v,l])=>{
    const b=el("button","pill"+(cfg.ofpMode===v?" on":""));b.textContent=l;
    b.addEventListener("click",()=>{S.cfg.ofpMode=v;saveCfg();if(S.tab==="settings")renderTab();});omRow.appendChild(b);
  });
  srow("OFP megjelenítés","",omRow);

  const verRow=el("div","flex aic gap8");
  const vs=el("span");vs.style.cssText="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums";vs.textContent=`${ver.codename} · ${ver.version}`;verRow.appendChild(vs);
  const devBtn=el("button","btn btn-dk");devBtn.style.cssText="font-size:10px;padding:4px 9px";devBtn.textContent="⚙ Dev";
  const devPanel=el("div","card");devPanel.style.cssText="display:none;margin-top:6px";
  devPanel.innerHTML=`<div style='font-size:11px;font-weight:600;color:var(--am);margin-bottom:9px'>⚙ Developer Options</div>`;
  const dr=el("div","flex gap8 aic");
  const cnI=el("input","inp f1");cnI.value=ver.codename;cnI.placeholder="pl. Tahoe";
  const chS=el("select","inp");chS.style.fontSize="10px";chS.innerHTML=`<option value='release'${ver.channel==="release"?" selected":""}>release</option><option value='dev'${ver.channel==="dev"?" selected":""}>dev</option>`;
  const saveB=el("button","btn btn-cy");saveB.style.cssText="font-size:11px;padding:6px 12px;align-self:flex-end";saveB.textContent="Mentés";
  saveB.addEventListener("click",async()=>{
    await api("/api/version",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codename:cnI.value,channel:chS.value})});
    S.ver=await api("/api/version");if(S.tab==="settings")renderTab();
  });
  dr.appendChild(cnI);dr.appendChild(chS);dr.appendChild(saveB);devPanel.appendChild(dr);
  devBtn.addEventListener("click",()=>{devPanel.style.display=devPanel.style.display==="none"?"block":"none";});
  verRow.appendChild(devBtn);srow("Verzió","",verRow);m.appendChild(devPanel);

  // Layout toggle
  const lyRow=el("div","flex gap6");
  [["1","1 oszlop"],["2","2 oszlop"]].forEach(([v,l])=>{
    const b=el("button","pill"+(( cfg.layout||"1")===v?" on":""));b.textContent=l;
    b.addEventListener("click",()=>{S.cfg.layout=v;saveCfg();if(S.tab==="settings")renderTab();});lyRow.appendChild(b);
  });
  srow("Elrendezés","Shortcut grid oszlopszám",lyRow);
}

// ── Login ──────────────────────────────────────────────────────────
let _lm="login";
$("lmLogin").addEventListener("click",()=>{_lm="login";$("lmLogin").classList.add("on");$("lmReg").classList.remove("on");$("lbtn").textContent="Belépés";});
$("lmReg").addEventListener("click",()=>{_lm="register";$("lmReg").classList.add("on");$("lmLogin").classList.remove("on");$("lbtn").textContent="Fiók létrehozása";});
$("eyeBtn").addEventListener("click",()=>{const p=$("lpw");p.type=p.type==="password"?"text":"password";});
$("lemail").addEventListener("keydown",e=>{if(e.key==="Enter")$("lpw").focus();});
$("lpw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
$("lbtn").addEventListener("click",doLogin);
$("logoutBtn").addEventListener("click",()=>auth.signOut());

async function doLogin(){
  const email=$("lemail").value,pw=$("lpw").value;
  if(!email||!pw){const e=$("lerr");e.textContent="Töltsd ki mindkét mezőt.";e.style.display="block";return;}
  $("lbtn").textContent="...";
  try{
    if(_lm==="login")await auth.signInWithEmailAndPassword(email,pw);
    else await auth.createUserWithEmailAndPassword(email,pw);
  }catch(e){
    const msgs={"auth/invalid-credential":"Hibás email vagy jelszó.","auth/user-not-found":"Nincs ilyen fiók.",
                "auth/wrong-password":"Hibás jelszó.","auth/email-already-in-use":"Foglalt email.",
                "auth/weak-password":"Jelszó min. 6 karakter."};
    const err=$("lerr");err.textContent=msgs[e.code]||e.message;err.style.display="block";
    $("lbtn").textContent=_lm==="login"?"Belépés":"Fiók létrehozása";
  }
}

auth.onAuthStateChanged(async user=>{
  S.user=user;
  if(user){
    $("lo").style.display="none";
    $("barEmail").textContent=user.email||"";
    await loadCfg();
    S.ver=await api("/api/version");
    connectRTDB();
    renderSidebar();renderTab();renderBar();
    if(S.cfg.sbUser)loadOFP(S.cfg.sbUser);
    setTimeout(async()=>{
      const u=await api("/api/update");
      if(u&&u.update){
        const b=el("div");b.style.cssText="position:fixed;top:0;left:0;right:0;padding:7px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,180,84,.92);color:#08090e;font-size:11px;font-weight:600;z-index:50";
        b.innerHTML=`🆕 Új verzió: ${u.codename}`;
        if(u.url){const lb=el("button");lb.style.cssText="background:rgba(0,0,0,.15);border:none;border-radius:5px;padding:2px 8px;cursor:pointer;font-size:10px;color:#08090e;margin-right:6px";lb.textContent="Letöltés";lb.addEventListener("click",()=>openBrowser(u.url));b.appendChild(lb);}
        const cb=el("button");cb.style.cssText="background:rgba(0,0,0,.15);border:none;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:10px;color:#08090e";cb.textContent="✕";cb.addEventListener("click",()=>b.remove());b.appendChild(cb);document.body.appendChild(b);
      }
    },5000);
  }else{
    $("lo").style.display="flex";
  }
});
</script>
